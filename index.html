<html data-theme="light">
<head>
  <title>Thai Research Group</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="./css/index.css"/>
</head>
<body>
  <div class="is-flex is-justify-content-end">
    <h1 class="title is-1">JET Research Group</h1>
  </div>
  <figure class="image">
    <img src="images/banner.png"/>
  </figure>
  <div class="buttons has-addons">
    <button class="button is-flex-grow-1 is-selected">Home</button>
    <button class="button is-flex-grow-1">Current Members</button>
    <button class="button is-flex-grow-1">Group Alumni</button>
    <button class="button is-flex-grow-1">Research</button>
    <button class="button is-flex-grow-1">Publications</button>
    <button class="button is-flex-grow-1">Gallery</button>
    <button class="button is-flex-grow-1">Teaching</button>
    <button class="button is-flex-grow-1">Links for Undergraduates</button>
  </div>
  <div class="is-flex">
    <div class="news box is-flex-grow-1">
      <h2 class="title is-2">Group News</h2>
      <div class="content">
        <p class="news-date is-underlined">August 14, 2026</p>
        <p>
          This website was first created!
        </p>
      </div>
    </div>
    <div class="contact-info box">
      <h2 class="title is-2">Contact Info</h2>
      <ul>
        <li>
          <span class="has-text-weight-bold">Email:</span>
          <span>jonathan.thai@scranton.edu</span>
        </li>
      </ul>
    </div>
  </div>
